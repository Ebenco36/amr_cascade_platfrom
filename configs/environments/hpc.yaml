environment:
  name: hpc
  data_root: data
  execution_mode: distributed
  default_data_layer: raw
  allow_raw_processing: true

features:
  auto_build_comorbidity: false
  auto_prepare_silver_feature_sources: false

cascade:
  validation:
    permutation_iterations: 1000
    bootstrap_iterations: 1000

reporting:
  # The availability-denominator sensitivity runs queued by
  # scripts/submit_everything_hpc.sh; build_supplementary_tables.py compares
  # each with this run in the Supplement's availability-sensitivity table.
  availability_sensitivity_environments:
    support_5: hpc_availability_sensitivity
    one_year_era: hpc_availability_annual_sensitivity
    joint: hpc_availability_joint_sensitivity
