reporting:
  tables_dir: outputs/tables
  figures_dir: outputs/figures
  reports_dir: outputs/reports
  forest_top_n: 15
  sankey_top_n: 30
  default_figure_formats:
    - html
    - png
    - pdf
    - svg
  default_figures:
    # Escalation (ER>1) and suppression (ER<1) are opposite observation behaviours
    # and are never pooled into one figure: cascade_directional produces a separate
    # Sankey, matrix, network, forest, and AWaRe-tier heatmap for each direction
    # (10 files per validation tier). It replaces the old primary_cascade_forest /
    # validated_primary_cascade_forest / cascade_sankey / cascade_chord /
    # cascade_network / aware_transition_heatmap figures, which pooled both
    # directions -- the old forest ranked by raw ER descending, so every
    # suppression pattern (ER<1) silently lost to every escalation pattern and
    # never appeared in its top-N; the old heatmap coloured log10(ER) on a plain
    # sequential scale, which is not meaningful for ER<1; the old AWaRe heatmap
    # averaged escalation-ratio across both directions into one number that
    # represented neither. The plotters and FigureManager methods for the old
    # figures still exist (nothing referencing them elsewhere breaks) but are no
    # longer part of the default output set.
    - cascade_directional
    - cascade_evidence_scatter
    - prevalence_shift_forest
    - cascade_consequence_summary
    - prevalence_shift_curves
    - mnar_tipping_point
    - model_metrics_comparison
    - model_pr_curve
    - model_roc_curve
    - model_calibration
    - model_threshold_analysis
    - validation_diagnostics
    - er_landscape
    - mnar_prevalence_shift_distribution
    - validation_funnel
    - panel_bundling
    - temporal_stability
    - cross_site_concordance
    - consort_diagram
    - operational_availability_suite
    - observation_coverage
    - descriptive_summaries
    # - dataset_characterization   # opt-in: reads the full drug_pair_episodes.parquet (100M+ rows combined scope) -- ran this platform out of memory in local testing; request with --figure dataset_characterization on a machine with headroom, not as part of the default run
  plotly_template: plotly_white
  image_width: 1600
  image_height: 900
  # Eligible opportunities in site-era strata with fewer observed results than this
  # are counted as resting on thin availability evidence; 5 is the stricter
  # availability sensitivity's minimum (gold.eligibility.availability_min_observed).
  thin_availability_support: 5
  # CLSI M39: percentages from fewer than 30 tested isolates are marked, not relied on.
  antibiogram_min_tested: 30
  # Availability-denominator sensitivity runs the supplement compares with this run
  # (label -> environment). Set per environment; empty means none were run.
  availability_sensitivity_environments: {}
