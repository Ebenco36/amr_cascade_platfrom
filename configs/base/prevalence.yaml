prevalence:
  output_dir: prevalence_shift
  min_eligible_support: 200
  min_tested_support: 30
  min_resistant_support: 5
  default_top_n: 20
  delta_curve_points: 41
  mnar_lambda_grid:
    - -2.0
    - -1.0
    - -0.5
    - 0.0
    - 0.5
    - 1.0
    - 2.0
  # The deprecated empirical-delta sensitivity, superseded by the MNAR lambda curves above.
  # Kept only to reproduce earlier runs; when false no legacy delta curves are computed or written.
  compute_legacy_delta: false
  decision_thresholds:
    - 0.10
    - 0.20
    - 0.30
