gold:
  shared_tables:
    - cohort
  episode_key_columns:
    - anon_id
    - pat_enc_csn_id_coded
    - order_proc_id_coded
    - order_time_jittered
    - organism
    - source_site
  culture_episode_columns:
    - anon_id
    - pat_enc_csn_id_coded
    - order_proc_id_coded
    - order_time_jittered
    - organism
    - source_site
    - ordering_mode
    - culture_description
    - was_positive
  culture_drug_columns:
    - anon_id
    - pat_enc_csn_id_coded
    - order_proc_id_coded
    - order_time_jittered
    - organism
    - source_site
    - antibiotic
    - susceptibility
  testing_matrix_prefix: tested__
  # Only these interpretations count as an observed AST result; blank and INCONCLUSIVE rows do not.
  observed_result_values:
    - RESISTANT
    - SUSCEPTIBLE
    - INTERMEDIATE
  # Non-therapeutic assays (ESBL phenotypic confirmation) removed before eligibility and pair construction.
  # They are also classified PHENOTYPIC_TEST below; the list stays as an explicit record.
  excluded_assay_labels:
    - CEFTAZIDIME/CLAVULANIC ACID
    - CEFOTAXIME/CLAVULANIC ACID
    - CEFEPIME/CLAVULANIC ACID
  # AST entity types kept in the observed layer (core.utils.antibiotic_names.classify_ast_entity).
  # Everything else -- SCREEN (e.g. cefoxitin screen), PHENOTYPIC_TEST (inducible clindamycin,
  # ESBL confirmation), RESISTANCE_MECHANISM_TEST (eCIM/mCIM), COMPOSITE_AST, ANTIFUNGAL,
  # ANTIMYCOBACTERIAL(_TEST) -- and rows without an antibiotic label are removed before eligibility
  # and pair construction, and counted per site and label in the gold metadata
  # (excluded_ast_entities). COMPOSITE_AST is a combined laboratory label that cannot be attributed
  # to one agent (CEPHALEXIN/CEPHALOTHIN, recorded at Stanford), so it is not a drug node in the
  # primary analysis; adding COMPOSITE_AST here gives the sensitivity analysis that keeps it.
  primary_ast_entity_types:
    - ANTIBACTERIAL
  eligibility:
    # Options:
    # - biological: current broad denominator; non-intrinsic organism-drug pairs are eligible.
    # - operational_site_organism_era: primary denominator; non-intrinsic pairs must also be
    #   empirically observed in the same source_site + organism + calendar era.
    denominator: operational_site_organism_era
    availability_era_years: 5
    availability_min_observed: 1
    availability_time_column: order_time_jittered
