preprocessing:
  sampling:
    default_fraction: 0.05
    random_seed: 42
    use_dask_threshold_mb: 10.0
    dask_blocksize: 100MB
    copy_reference_files_to_output: false
  comorbidity:
    output_filename: comorbidity_aggregated.parquet
    dask_blocksize: 100MB
    default_top_k: 20
    rarest_count: 10
    coverage_report_k_values:
      - 10
      - 20
      - 30
      - 50
      - 100
      - 200
      - 400
      - 500
      - 800
      - 1000
