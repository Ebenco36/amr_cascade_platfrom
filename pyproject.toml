[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "amr-cascade-platform"
version = "0.1.0"
description = "Production-ready platform for AST cascade analysis and cascade-aware feature engineering."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "dask[dataframe]>=2024.8.0,<2026.0",
  "distributed>=2024.8.0,<2026.0",
  "kaleido>=0.2.1,<1.0",
  "matplotlib>=3.8,<4.0",
  "networkx>=3.2,<4.0",
  "nbformat>=5.10,<6.0",
  "numpy>=1.26,<3.0",
  "pandas>=2.2,<3.0",
  "plotly>=5.24,<6.0",
  "pyarrow>=15,<20",
  "pycirclize>=1.7,<2.0",
  "PyYAML>=6,<7",
  "scikit-learn>=1.4,<2.0",
  "scipy>=1.12,<2.0",
  "tqdm>=4.66,<5.0",
  "xgboost>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
]

[project.scripts]
amr-cascade = "amr_cascade_platform.cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
